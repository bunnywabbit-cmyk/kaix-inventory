name: Keep backend warm

# Pings the deployed API's health check every 10 minutes so neither Render's
# free web service nor Neon's serverless compute scale to zero between real
# requests — both otherwise take several seconds to wake up on the next hit,
# which is what made reads/writes feel slow. /api/health itself touches the
# DB (not just the web process), so this keeps both warm without paying for
# always-on compute.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo
# activity (a push/commit resets that clock) — if pings stop firing, push
# any commit to re-enable it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 20 https://kaix-inventory.onrender.com/api/health
